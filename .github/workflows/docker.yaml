name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          df -hT
          sudo du -xh -d1 / 2>/dev/null | sort -h | tail -n 20

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 128
          remove-dotnet: "true"
          remove-haskell: "true"
          remove-android: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker/"

      - name: Restart docker
        run: sudo service docker restart

      - name: Show disk and Docker information
        run: |
          echo "Disk space after cleanup"
          df -hT
          docker info --format 'DockerRootDir={{.DockerRootDir}}'
          docker system df

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images to Aliyun
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
            --username "$ALIYUN_REGISTRY_USER" \
            --password-stdin \
            "$ALIYUN_REGISTRY"

          declare -A duplicate_images
          declare -A temp_map

          # 检查同名镜像是否来自不同命名空间
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"

            image_name_tag="${image##*/}"
            name_space=$(awk -F'/' '{
              if (NF == 3) print $2
              else if (NF == 2) print $1
              else print ""
            }' <<< "$image")

            name_space="${name_space}_"
            image_name="${image_name_tag%%:*}"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                echo "Duplicate image name: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space"
            fi
          done < images.txt

          cleanup_images() {
            docker image rm "$image" "$new_image" 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            docker system prune -af --volumes 2>/dev/null || true
          }

          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(awk '{print $NF}' <<< "$line")
            platform=$(sed -nE 's/.*--platform[ =]([^ ]+).*/\1/p' <<< "$line")

            cleanup_images

            echo "Pulling image: $image"
            if [[ -n "$platform" ]]; then
              docker pull --platform "$platform" "$image"
              platform_prefix="${platform//\//_}_"
            else
              docker pull "$image"
              platform_prefix=""
            fi

            image="${image%%@*}"
            image_name_tag="${image##*/}"
            name_space=$(awk -F'/' '{
              if (NF == 3) print $2
              else if (NF == 2) print $1
              else print ""
            }' <<< "$image")

            image_name="${image_name_tag%%:*}"
            name_space_prefix=""

            if [[ -n "${duplicate_images[$image_name]:-}" ]] &&
               [[ -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "Tagging image: $new_image"
            docker tag "$image" "$new_image"

            echo "Pushing image: $new_image"
            docker push "$new_image"

            echo "Removing pushed images"
            cleanup_images

            echo "Disk space after processing $image"
            df -hT
            docker system df
          done < images.txt

      - name: Cleanup Docker and check disk
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          docker system df || true
          df -hT
