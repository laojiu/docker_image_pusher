name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check disk before cleanup
        run: |
          echo "Disk before cleanup"
          df -hT
          sudo du -xh -d1 / 2>/dev/null | sort -h | tail -n 20 || true

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 128
          remove-dotnet: "true"
          remove-haskell: "true"
          remove-android: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker/"

      - name: Restart Docker
        run: sudo service docker restart

      - name: Check disk and Docker configuration
        run: |
          echo "Disk after cleanup"
          df -hT
          echo "Docker root directory:"
          docker info --format 'DockerRootDir={{.DockerRootDir}}'
          echo "Docker disk usage:"
          docker system df

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images to Aliyun
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
            --username "$ALIYUN_REGISTRY_USER" \
            --password-stdin \
            "$ALIYUN_REGISTRY"

          declare -A duplicate_images=()
          declare -A temp_map=()

          # 检查是否有不同命名空间的同名镜像
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"

            image_name_tag="${image##*/}"
            name_space=$(awk -F'/' '{
              if (NF == 3) print $2
              else if (NF == 2) print $1
              else print ""
            }' <<< "$image")

            image_name="${image_name_tag%%:*}"
            namespace_key="${name_space}_"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$namespace_key" ]]; then
                echo "Duplicate image name from different namespaces: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$namespace_key"
            fi
          done < images.txt

          # 不依赖尚未赋值的 image/new_image 变量
          cleanup_docker() {
            docker image prune -af || true
            docker builder prune -af || true
          }

          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(awk '{print $NF}' <<< "$line")
            platform=$(sed -nE 's/.*--platform[ =]([^ ]+).*/\1/p' <<< "$line")

            # 清除上一个镜像留下的未使用数据
            cleanup_docker

            echo "Pulling image: $image"
            if [[ -n "$platform" ]]; then
              docker pull --platform "$platform" "$image"
              platform_prefix="${platform//\//_}_"
            else
              docker pull "$image"
              platform_prefix=""
            fi

            # 去掉 digest，得到源镜像名和标签
            image="${image%%@*}"
            image_name_tag="${image##*/}"

            name_space=$(awk -F'/' '{
              if (NF == 3) print $2
              else if (NF == 2) print $1
              else print ""
            }' <<< "$image")

            image_name="${image_name_tag%%:*}"
            name_space_prefix=""

            if [[ -n "${duplicate_images[$image_name]:-}" ]] &&
               [[ -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "Tagging image: $image -> $new_image"
            docker tag "$image" "$new_image"

            echo "Pushing image: $new_image"
            docker push "$new_image"

            echo "Removing pushed images"
            docker image rm "$image" "$new_image" 2>/dev/null || true
            cleanup_docker

            echo "Disk usage after processing $image"
            df -hT
            docker system df
          done < images.txt

      - name: Final Docker cleanup and disk report
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true
          docker system df || true
          df -hT
