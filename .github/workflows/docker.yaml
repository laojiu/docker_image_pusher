name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest

    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          df -hT

      # 增加可用磁盘空间
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: "true"
          remove-haskell: "true"
          remove-android: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker/"

      - name: Restart docker
        run: sudo service docker restart

      - name: Check disk space after cleanup
        run: |
          echo "Disk space after freeing up space"
          df -hT
          docker system df || true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images to Aliyun
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login \
            --username "$ALIYUN_REGISTRY_USER" \
            --password-stdin \
            "$ALIYUN_REGISTRY"

          # 预处理镜像列表，检查是否存在同名但不同命名空间的镜像
          declare -A duplicate_images=()
          declare -A temp_map=()

          while IFS= read -r line || [[ -n "$line" ]]; do
            # 忽略空行和注释
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"

            image_name_tag="${image##*/}"
            name_space=$(awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}' <<< "$image")
            name_space="${name_space}_"
            image_name="${image_name_tag%%:*}"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                echo "Duplicate image name from different namespaces: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space"
            fi
          done < images.txt

          # 拉取、推送并清理镜像
          while IFS= read -r line || [[ -n "$line" ]]; do
            # 忽略空行和注释
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(awk '{print $NF}' <<< "$line")
            platform=$(sed -nE 's/.*--platform[ =]([^ ]+).*/\1/p' <<< "$line")

            echo "Pulling image: $image"
            if [[ -n "$platform" ]]; then
              docker pull --platform "$platform" "$image"
              platform_prefix="${platform//\//_}_"
            else
              docker pull "$image"
              platform_prefix=""
            fi

            image="${image%%@*}"
            image_name_tag="${image##*/}"
            name_space=$(awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}' <<< "$image")
            image_name="${image_name_tag%%:*}"

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            echo "Tagging image: $new_image"
            docker tag "$image" "$new_image"

            echo "Pushing image: $new_image"
            docker push "$new_image"

            echo "Removing pushed images to free disk space"
            docker image rm "$image" "$new_image" || true
            docker image prune -f || true
            docker builder prune -af || true

            echo "Disk space after processing $image"
            df -hT
            docker system df || true
          done < images.txt

      # 即使拉取或推送失败，也尝试清理 Docker 镜像和构建缓存
      - name: Cleanup Docker data
        if: always()
        run: |
          docker image prune -af || true
          docker builder prune -af || true
          docker system df || true
          df -hT
